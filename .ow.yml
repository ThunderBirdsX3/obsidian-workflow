# ─────────────────────────────────────────────────────────────────────────────
# obsidian-workflow — SHARED project configuration (git-tracked, commit this file)
# ─────────────────────────────────────────────────────────────────────────────
# Scope: project-wide settings ที่เหมือนกันทุกคนในทีม
#   - project metadata (name, language, timezone)
#   - vault_path, mode, ow.version (the one pinned version)
#   - subagents baseline + project guardrails
#
# Precedence (resolved by scripts/ow-paths.sh):  .ow.yml  >  hardcoded defaults
#
# Generated by /ow-init — modify carefully
# ─────────────────────────────────────────────────────────────────────────────

# Project metadata
project:
  name: "Library Book Tracker"          # change to your project name
  slug: "library-book-tracker"          # used in filenames
  language: "th"                        # chat / reports / end-of-command summaries (th|en)
  vault_language: "en"                  # language of documents written into the vault.
                                        # unset ⇒ follows `language`. vault docs are re-read
                                        # far more often than written, so English costs ~2.7×
                                        # fewer tokens per character than Thai.
  timezone: "Asia/Bangkok"

# Mode: standalone | submodule
# - standalone: obsidian-workflow is the project root
# - submodule: obsidian-workflow is included as a git submodule in a larger repo;
#   vault_path may point outside this folder (e.g., "../shared-vault")
mode: standalone

# Obsidian vault location — relative to the project root, or an absolute path for a vault outside the repo
# Default: docs/obsidian-vault — แยกจาก docs/ เพื่อให้ docs/ เก็บเอกสารอื่นๆได้ด้วย
# (README, ARCHITECTURE.md, public API docs, etc.)
vault_path: docs/obsidian-vault

# obsidian-workflow installation metadata (consolidated under one block)
# - `version` = ow version (bumped by scripts/upgrade.sh) — ตัวเดียวที่ pin ทั้งระบบ
# - `source`  = where /ow-sync pulls from
# - `last_synced` = updated by /ow-sync Phase 6 + scripts/upgrade.sh
ow:
  version: "1.3.1"
  source: "https://github.com/ThunderBirdsX3/obsidian-workflow"
  last_synced: "2026-09-10"

# Subagents enabled for this project + the AI model each one runs on.
# /ow-init asks which ones; toggle `enabled` on/off and set `model` here.
# Files live in .claude/agents/<name>.md
#
# 🔴 Only the four always-on bodies ship with obsidian-workflow. The specialized rows below are
# NAMES, not files: enabling one does nothing until `/ow-agent create <name>` writes the
# body against this project's real stack (`/ow-agent suggest` reads the stack and tells
# you which ones are worth creating). Enabled with no file under .claude/agents/ = a flag
# with nothing behind it — install/upgrade report it, they never silently fill it in.
#
# `model` — family ALIASES (opus | sonnet | haiku), NO version pin, so each tracks the
# latest of its family (or pin a full id like claude-opus-4-8 if you must). The value is
# written into .claude/agents/<name>.md frontmatter by install / upgrade / /ow-sync /
# /ow-agent — never hand-edit the agent file.
#
# Shorthand: `<name>: true` (scalar) also works — enabled with the built-in default model
# (security → opus; backend/frontend/mobile/design/docs/verifier/test-runner → sonnet;
# gh-issue → haiku). The map form below just makes the model visible + editable.
#
# Cost note: a spawned subagent pays a COLD cache write (~1.25x base) on every run — it
# shares no context with the parent. Model choice therefore multiplies the most expensive
# token class. Raise an agent to opus only where a wrong answer is costlier than the run.
subagents:
  docs:        { enabled: true,  model: sonnet }   # vault keeper, always on
  verifier:    { enabled: true,  model: sonnet }   # test/lint/build runner, always on
  security:    { enabled: true,  model: opus   }   # secret/PII scanner — opus on purpose
  gh-issue:    { enabled: true,  model: haiku  }   # GitHub issue + image reader, always on
  # created on demand — /ow-agent suggest, then /ow-agent create <name>
  backend:     { enabled: false, model: sonnet }   # API/server work
  frontend:    { enabled: false, model: sonnet }   # web UI work
  mobile:      { enabled: false, model: sonnet }   # mobile app work
  design:      { enabled: false, model: sonnet }   # design system / Figma export → DS-Tokens
  test-runner: { enabled: false, model: sonnet }   # Playwright / Maestro E2E runner

# Slash-command AI model — injected into each generated .claude/commands/<verb>.md shim
# frontmatter by install / upgrade / /ow-sync (shim regen).
# - `model` = default for EVERY command. `inherit` ⇒ no pin (command follows the session
#   model you're chatting in). Or set a family alias opus|sonnet|haiku (no version) /
#   full claude-* id to pin all commands.
# - `overrides.<verb>` pins one command (alias|claude-*|inherit). Invalid value ⇒ inherit.
commands:
  model: inherit                        # default: follow the current session model
  overrides:                            # opus only where a wrong call is costlier than the run
    ow-plan: opus                      # plan is read+decide once; every later command inherits it
    ow-secure: opus                    # a missed secret/PII leak ships to a remote
    ow-implement: sonnet
    ow-fix: sonnet
    ow-fix-issue: sonnet
    ow-reverse-engineer: sonnet
    ow-clarify: sonnet
    ow-checklist: sonnet
    ow-new: sonnet
    ow-design: sonnet

# Submodules (used by /ow-git and /ow-implement)
# Leave empty for monorepo / single-codebase projects
submodules: []
# Example for a multi-repo setup:
# submodules:
#   - name: api
#     path: ./api
#     branch: develop
#   - name: web
#     path: ./web
#     branch: develop
#   - name: app
#     path: ./app
#     branch: master

# Doc templates — paths checked in order; first match wins
# Override .ow/templates/* by placing same filename in templates/
# (root `templates/` ไม่ได้ติดมากับ installer — สร้างเองเมื่อจะ customize)
template_lookup:
  - templates                           # project-customized (highest priority, optional)
  - .ow/templates                 # org-level snapshot (always present; v0.4 flat layout)

# Safety guardrails
guardrails:
  no_fake_results: true                 # enforce — never invent commit hash, tokens, links, pass/fail counts
  visible_menu_default: true            # UI checks via visible menu unless labeled technical-only
  prod_write_blocked: true              # block writes to production envs
  pii_masking_required: true            # mask PII in any output quoted into the vault

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL v0.7 blocks (#16) — every block is OPTIONAL. An empty/absent block
# reproduces v0.6 behavior exactly (resolved-value parity). Single-repo shape is
# shown first; multi-repo variants are in comments.
# ─────────────────────────────────────────────────────────────────────────────

# Build/test per area. OPTIONAL — empty ⇒ resolver falls back to repo convention
# (scripts in package.json / Makefile / etc.). Never makes a toolchain mandatory.
verification_matrix: []
#   - { area: default, detect: "package.json", build: "<build cmd>", test: "<test cmd>", pass_regex: "<regex>", coverage_threshold_lines: 0 }

# Test-credential SCHEMA only — actual values live in the gitignored env file.
test_credentials:
  env_file: ".env.test"
  example_file: ".env.test.example"
  roles: []                             # [{ label: role1, user_var: TEST_ROLE1_USER, pass_var: TEST_ROLE1_PASS }, ...]
  redact: true                          # mask any value read from the env file in logs/handoff

# `unified: true` (default) — /ow-git --bump ให้ทุก submodule ที่ push รอบเดียวได้ version
# เดียวกัน (= bump จาก max ของ current version ทุก repo). false = bump แยกต่อ repo (legacy)
# `files:` เขียนผ่าน scripts/ow-version.sh เท่านั้น — bare semver (v อยู่บน git tag เท่านั้น)
# + read-back verify + format gate ก่อน commit/tag/push (#34)
# `build_number:` (default increment) นโยบายเลข build ของไฟล์ที่มี `X.Y.Z+<digits>` (pubspec)
#                 increment = +1 คงความกว้าง zero-pad · preserve = คงเดิม · drop = ตัดทิ้ง
# `verify_cmd:` (default []) คำสั่งของ ecosystem เองที่เป็นตัวตัดสินจริง รันหลังเขียนก่อน commit
#                 เช่น ["cd app && flutter pub get"] — fail = STOP ก่อน tag/push
version_bump: { files: [], docs_only_skip: true, append_tag: "[v{version}]", unified: true, build_number: increment, verify_cmd: [] }

# Multi-person git — /ow-git syncs with origin before it commits/pushes so two people
# on the same branch never fight over a non-fast-forward push.
#   auto_sync    true = fetch + rebase onto upstream before staging (turn off per run
#                with `/ow-git --no-sync`). No remote / offline ⇒ skipped silently.
#   strategy     rebase (default, linear history) | merge
#   auto_resolve conflict classes resolved WITHOUT a human. Every one is reported.
#                version   — version file / package.json version → keep the higher semver
#                lock      — lock file → regenerate from the manifest (regen must succeed)
#                changelog — CHANGELOG.md → union both sides, higher version first
#                vault     — vault .md, but ONLY where the conflict
#                            is pure table rows / list items with no repeated primary key
#                            (IMPLEMENTATION-STATUS, MOCs). Any prose line ⇒ human.
#                []        — resolve nothing automatically
#   push_retry   non-fast-forward push → re-sync and push again this many times
git:
  auto_sync: true
  strategy: rebase
  auto_resolve: [version, lock, changelog, vault]
  push_retry: 1

# Vault dir-name overrides — only entries that DIFFER from the numbered default.
# A brownfield project may already use a differently-named phase/plan folder.
vault_dirs: {}
#   phases:   "50-Phases"

# Integrity gate — what must be true before a status flip.
integrity_gate:
  verify_commit_hashes: true

# Project rules registry (#17). Empty files ⇒ glob .ow/rules/*.md by applies_to.
rules: { dir: ".ow/rules", files: [] }
